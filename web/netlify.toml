# Netlify Configuration for Sermon AI

[build]
  # Directory to publish (static files)
  publish = "."

  # Functions directory
  functions = "netlify/functions"

# Redirects - serve index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin", "editor"]}

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Function configuration
[functions]
  # Node.js version for functions
  node_bundler = "esbuild"

  # Timeout for functions (in seconds, max 26 for free tier)
  [functions."chat"]
    timeout = 26
